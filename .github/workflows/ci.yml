name: Floora AR CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks-and-container-build:
    name: Lint, test, build, and container images
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked workspace dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run API and UI tests
        run: npm test

      - name: Build production frontend
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API and frontend images
        run: docker compose build --pull api frontend

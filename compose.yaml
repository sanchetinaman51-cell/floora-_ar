name: floora-ar
services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      API_PORT: 3001
      DATABASE_PATH: /app/.data/floora.sqlite3
      NODE_ENV: development
      OPERATOR_REVIEW_TOKEN: ${OPERATOR_REVIEW_TOKEN:-}
    volumes:
      - floora-data:/app/.data
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FLOORA_WEB_PORT:-8080}:80"
    restart: unless-stopped

volumes:
  floora-data:
